name: harvest-youtube

# Harvests transcripts with the vendored toolkit in scripts/yt/ (playlist.py →
# harvest.py → ytfetch.py). That toolkit's approach is the one that works:
# yt-dlp for the signed caption URL (with --remote-components ejs:github so the
# solver scripts are present), then the caption *JSON document* fetched through
# r.jina.ai. It never scrapes the player page.
#
# Optional: a YT_COOKIES secret clears the metadata bot wall. Without it the
# runner's datacenter IP may be refused — the run reports which.

on:
  # Temporary: harvests the rest of the playlist from this branch while
  # gh workflow run returns 403 to the integration. Remove once dispatched.
  push:
    paths:
      - '.github/workflows/harvest-youtube.yml'
  workflow_dispatch:
    inputs:
      collection:
        description: 'Collection to harvest'
        required: true
        default: 'christian-house'
        type: choice
        options:
          - christian-house
      limit:
        description: 'Max videos (0 = all)'
        required: false
        default: '0'
      workers:
        description: 'Parallel workers (4 is the documented ceiling)'
        required: false
        default: '4'

permissions:
  contents: write

concurrency:
  group: harvest-youtube
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # yt-dlp ignores Node unless named explicitly; Deno is its default runtime.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp and requests
        # [default] brings the bundled EJS solver scripts; ejs:github covers the rest.
        run: pip install --quiet -U "yt-dlp[default]>=2026.11.23" requests

      - name: Restore cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then
            echo "no YT_COOKIES secret — continuing without cookies"
            exit 0
          fi
          printf '%s' "$YT_COOKIES" > cookies.txt
          echo "cookies restored ($(wc -l < cookies.txt) lines)"

      - name: Probe one video
        run: |
          set +e
          COOKIE=""
          [ -f cookies.txt ] && COOKIE="--cookies cookies.txt"
          echo "deno: $(deno --version 2>/dev/null | head -1)"
          echo "yt-dlp: $(yt-dlp --version)"
          python3 scripts/yt/ytfetch.py wgsJbNzePrI $COOKIE 2>&1 | head -25

      - name: Enumerate the playlist
        run: |
          set -euo pipefail
          python3 scripts/yt/playlist.py \
            "https://www.youtube.com/playlist?list=PL92WcLuzyEGORejB8thjnIOCfxedSicKR" \
            -o manifest.json

      - name: Harvest transcripts
        env:
          LIMIT: ${{ inputs.limit || '0' }}
          WORKERS: ${{ inputs.workers || '4' }}
        run: |
          set +e
          COOKIE=""
          [ -f cookies.txt ] && COOKIE="--cookies cookies.txt"
          LIMIT_ARG=""
          [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ] && LIMIT_ARG="--limit $LIMIT"
          python3 scripts/yt/harvest.py manifest.json \
            -o transcripts --workers "${WORKERS:-4}" $COOKIE $LIMIT_ARG \
            2>&1 | tee /tmp/harvest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::harvest failed ($status): $(tail -12 /tmp/harvest.log | tr '\n' ' ' | cut -c1-800)"
          fi
          exit "$status"

      - name: Ingest into the app
        env:
          COLLECTION: ${{ inputs.collection || 'christian-house' }}
        run: |
          set -euo pipefail
          if ! python3 scripts/ingest_youtube.py \
                 --collection "$COLLECTION" --src transcripts --manifest manifest.json \
                 2> /tmp/ingest.err; then
            echo "::error::ingest failed: $(tail -6 /tmp/ingest.err | tr '\n' ' ' | cut -c1-700)"
            echo "---- first lines of a harvested file ----"
            head -c 400 "$(ls transcripts/*.json | head -1)" || true
            exit 1
          fi

      - name: Regenerate the app index
        run: python3 scripts/harvest_drive.py --build-ts

      # The .docx packages are derived from the corpus, so rebuild them whenever
      # new transcripts land; otherwise their labels drift.
      - name: Rebuild the DOCX packages
        run: |
          pip install --quiet python-docx
          python3 scripts/generate_docx_packages.py

      - name: Commit results
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/transcripts data/catalog public/transcripts src/data/libraryTranscripts.ts \
            public/downloads downloads
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore(harvest): Christian House transcripts [skip ci]"
          git pull --rebase --autostash
          git push
