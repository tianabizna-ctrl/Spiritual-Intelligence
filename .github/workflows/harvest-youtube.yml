name: harvest-youtube

# Harvests transcripts for playlists that are not in the Drive library, using
# the reader-proxy method from SKILL.md: yt-dlp for the signed caption URL,
# r.jina.ai to fetch it from a different egress IP.
#
# The sandbox this repo is edited from cannot reach YouTube at all, so this
# only works on a runner. No secrets required.

on:
  push:
    paths:
      - '.github/workflows/harvest-youtube.yml'
      - 'scripts/harvest_youtube_proxy.py'
  workflow_dispatch:
    inputs:
      collection:
        description: 'Collection to harvest'
        required: true
        default: 'christian-house-selman'
        type: choice
        options:
          - christian-house-selman
      limit:
        description: 'Max videos (0 = all) — use 3 for a smoke test'
        required: false
        default: '0'
      workers:
        description: 'Parallel workers (4 is what the skill recommends)'
        required: false
        default: '4'

permissions:
  contents: write

concurrency:
  group: harvest-youtube
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: pip install --quiet "yt-dlp>=2026.11.23"

      - name: Probe reachability
        run: |
          set +e
          curl -sS -o /dev/null -w "youtube.com      -> %{http_code}\n" -m 20 https://www.youtube.com/
          curl -sS -o /dev/null -w "r.jina.ai        -> %{http_code}\n" -m 30 https://r.jina.ai/https://example.com/
          yt-dlp --version

      - name: Harvest
        env:
          COLLECTION: ${{ inputs.collection || 'christian-house-selman' }}
          LIMIT: ${{ inputs.limit || '3' }}
          WORKERS: ${{ inputs.workers || '2' }}
        run: |
          set +e
          LIMIT_ARG=""
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then LIMIT_ARG="--limit $LIMIT"; fi
          python3 scripts/harvest_youtube_proxy.py \
            --collection "$COLLECTION" \
            --workers "${WORKERS:-4}" \
            $LIMIT_ARG 2>&1 | tee /tmp/harvest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::harvest failed ($status): $(tail -15 /tmp/harvest.log | tr '\n' ' ' | cut -c1-800)"
          fi
          exit "$status"

      - name: Regenerate the app index
        run: python3 scripts/harvest_drive.py --build-ts

      - name: Commit results
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/transcripts data/catalog public/transcripts src/data/libraryTranscripts.ts
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "chore(harvest): Christian House playlist [skip ci]"
          git pull --rebase --autostash
          git push
