name: harvest-drive

# Harvests the full transcript library from the public Google Drive folders
# (prayers + Dr. Myles Munroe teachings) and commits it back. No secrets needed.

on:
  push:
    paths:
      - '.github/workflows/harvest-drive.yml'
  workflow_dispatch:
    inputs:
      collections:
        description: 'Comma-separated: prayers,teachings (empty = both)'
        required: false
        default: ''
      limit:
        description: 'Max files per collection (0 = all)'
        required: false
        default: '0'
      sleep_seconds:
        description: 'Delay between downloads'
        required: false
        default: '0.4'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe Drive reachability
        run: |
          curl -sS -o /dev/null -w "embeddedfolderview -> %{http_code}\n" \
            "https://drive.google.com/embeddedfolderview?id=1DojoodInjPh6r7dHmGVKUBYT3FqL4QPk#list" || true
          curl -sS -o /dev/null -w "usercontent -> %{http_code}\n" \
            "https://drive.usercontent.google.com/download?id=1xQfxb23hh5RjneK8276sjjSznCJYIXMZ&export=download" || true

      - name: Harvest transcripts
        env:
          COLLECTIONS: ${{ inputs.collections }}
          LIMIT: ${{ inputs.limit }}
          SLEEP: ${{ inputs.sleep_seconds }}
        run: |
          ARGS=""
          if [ -n "$COLLECTIONS" ]; then
            for c in $(echo "$COLLECTIONS" | tr ',' ' '); do ARGS="$ARGS --collection $c"; done
          fi
          LIMIT_ARG=""
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then LIMIT_ARG="--limit $LIMIT"; fi
          python3 scripts/harvest_drive.py $ARGS $LIMIT_ARG --sleep "${SLEEP:-0.4}"

      - name: Regenerate the app index
        run: python3 scripts/harvest_drive.py --build-ts

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/transcripts data/catalog public/transcripts src/data/libraryTranscripts.ts
          git diff --cached --quiet && { echo "nothing new to commit"; exit 0; }
          git commit -m "chore(harvest): Drive transcript library [skip ci]"
          git pull --rebase --autostash
          git push
