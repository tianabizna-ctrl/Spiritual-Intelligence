name: actions-probe
on:
  push:
    paths:
      - '.github/workflows/actions-probe.yml'
      - 'scripts/probe_runner.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install harvest dependencies
        run: python3 -m pip install --quiet yt-dlp youtube-transcript-api
      - name: Run connectivity probe
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python3 scripts/probe_runner.py || true
      - name: Commit probe report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/catalog/probe_report.json
          git commit -m "chore(probe): runner connectivity report [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
