name: actions-probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_transcripts.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install harvest dependencies
        run: python3 -m pip install --quiet yt-dlp youtube-transcript-api
      - name: Probe transcript extraction strategies
        run: python3 scripts/probe_transcripts.py || true
      - name: Commit probe report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/catalog/probe_transcripts.json
          git commit -m "chore(probe): transcript extraction strategy report [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
