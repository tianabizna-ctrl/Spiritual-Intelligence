name: harvest-library

# Harvests English transcripts for all 377 videos across the three source
# playlists and commits them back to the branch.
#
# YouTube blocks datacenter IPs ("Sign in to confirm you're not a bot"), so a
# YT_COOKIES secret is REQUIRED for this to work. See README -> "Harvesting the
# Full 377-Transcript Library".

on:
  # TEMPORARY validation trigger — removed once the workflow is confirmed valid.
  push:
    paths:
      - '.github/workflows/harvest-library.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Stop after N newly fetched transcripts (0 = all)'
        required: false
        default: '0'
      sleep_seconds:
        description: 'Delay between requests, in seconds'
        required: false
        default: '2'
      playlists:
        description: 'Comma-separated playlist IDs (empty = all three)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: harvest-library
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-harvest.txt

      - name: Install harvest dependencies
        run: python3 -m pip install --quiet -r scripts/requirements-harvest.txt

      - name: Restore YouTube cookies from secret
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -z "$YT_COOKIES" ]; then
            echo "::warning::No YT_COOKIES secret set. YouTube will reject every transcript request with 'Sign in to confirm you are not a bot'. See README."
            exit 0
          fi
          printf '%s' "$YT_COOKIES" | sed 's/\\n/\n/g' > "$RUNNER_TEMP/yt_cookies.txt"
          chmod 600 "$RUNNER_TEMP/yt_cookies.txt"
          echo "cookies restored: $(wc -l < "$RUNNER_TEMP/yt_cookies.txt") lines"

      - name: Enumerate the three playlists
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PLAYLISTS: ${{ inputs.playlists }}
        run: |
          ARGS=""
          if [ -n "$PLAYLISTS" ]; then
            for id in $(echo "$PLAYLISTS" | tr ',' ' '); do ARGS="$ARGS --playlist $id"; done
          fi
          COOKIES_ARG=""
          if [ -f "$RUNNER_TEMP/yt_cookies.txt" ]; then COOKIES_ARG="--cookies $RUNNER_TEMP/yt_cookies.txt"; fi
          PROXY_ARG=""
          if [ -n "$PROXY_URL" ]; then PROXY_ARG="--proxy $PROXY_URL"; fi
          python3 scripts/harvest_catalog.py $ARGS $COOKIES_ARG $PROXY_ARG || true
          python3 - <<'PY'
          import glob, json
          total = 0
          for path in sorted(glob.glob("data/catalog/playlist_*.json")):
              with open(path) as f:
                  data = json.load(f)
              n = len(data.get("videos") or [])
              total += n
              print(f"{data.get('playlistId')}: {n} videos")
          print(f"TOTAL catalogue: {total}")
          PY

      - name: Download transcripts
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          LIMIT: ${{ inputs.limit }}
          SLEEP: ${{ inputs.sleep_seconds }}
        run: |
          COOKIES_ARG=""
          if [ -f "$RUNNER_TEMP/yt_cookies.txt" ]; then COOKIES_ARG="--cookies $RUNNER_TEMP/yt_cookies.txt"; fi
          PROXY_ARG=""
          if [ -n "$PROXY_URL" ]; then PROXY_ARG="--proxy $PROXY_URL"; fi
          LIMIT_ARG=""
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then LIMIT_ARG="--limit $LIMIT"; fi
          set +e
          python3 scripts/harvest_transcripts.py --sleep "${SLEEP:-2}" --abort-after 12 $LIMIT_ARG $COOKIES_ARG $PROXY_ARG
          RC=$?
          if [ "$RC" = "3" ]; then
            echo "::error::Harvest aborted early: YouTube is refusing this runner's IP. Set the YT_COOKIES secret (see README) and re-run."
            exit 1
          fi
          exit 0

      - name: Regenerate the app transcript index
        run: python3 scripts/harvest_transcripts.py --build-ts

      - name: Commit harvested transcripts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/transcripts data/catalog public/transcripts src/data/libraryTranscripts.ts
          git diff --cached --quiet && { echo "nothing new to commit"; exit 0; }
          git commit -m "chore(harvest): English transcripts for the full library [skip ci]"
          git pull --rebase --autostash
          git push
